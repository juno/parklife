name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # esbuild ships prebuilt binaries; its ignored postinstall is harmless, but
      # pnpm's CI-mode strict-dep-builds turns that warning into a hard failure.
      - run: pnpm install --frozen-lockfile --config.strict-dep-builds=false

      - run: pnpm tauri build --bundles app

      # Distribute a single artifact: an ad-hoc signed .app.zip.
      # ad-hoc sign so Gatekeeper reports "unidentified developer" instead of "damaged"
      # (a valid signature is mandatory on Apple Silicon). Still unnotarized, so users
      # open it via System Settings > Privacy & Security > Open Anyway on first launch.
      # No Apple Developer account needed.
      - name: Sign, zip, and publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          cd src-tauri/target/release/bundle/macos
          codesign --deep --force --sign - Parklife.app
          ditto -c -k --keepParent Parklife.app Parklife.app.zip
          gh release create "$TAG" Parklife.app.zip --title "$TAG" --target "$GITHUB_SHA" \
            || gh release upload "$TAG" Parklife.app.zip --clobber
